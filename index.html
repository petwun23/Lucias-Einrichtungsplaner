function menu(){show('Menü',`<div class="menuitems" id="menuItems"></div><p class="help">Der Raum passt sich automatisch an den Bildschirm an. Die Maße bleiben maßstabsgetreu. Nicht benötigte Möbel kannst du in die Ablage legen und später zurückholen.</p>`);const a=$('menuItems');[['＋ Möbel',()=>form('furniture')],['＋ Tür',()=>form('door')],['＋ Fenster',()=>form('window')],['Raummaße',()=>form('room')],['Möbelablage',showParking],['Meine Zimmer',roomLibrary],['Plan sichern',exportPlan],['Plan laden',()=>{$('file').click();close()}],['Schließen',close]].forEach(([t,fn])=>a.append(button(t,fn)))}
const ROOM_LIBRARY_KEY='lucia_room_library_v1';
function getLibrary(){
 try{
  const lib=JSON.parse(localStorage.getItem(ROOM_LIBRARY_KEY));
  if(lib&&Array.isArray(lib.rooms)&&lib.rooms.length<=100&&lib.rooms.every(r=>r&&typeof r.name==='string'&&r.name.length<=80&&validRoom(r.plan?.room)&&Array.isArray(r.plan?.items)&&r.plan.items.length<=300&&r.plan.items.every(validItem)))return lib;
 }catch(e){}

}
function putLibrary(lib){

}
function roomLibrary(){

 $('roomClose').onclick=close;

 };
 $('roomSave').onclick=()=>{
  const currentRoom=lib.rooms.find(r=>r.id===lib.active);
  const name=prompt('Name des Zimmers:',currentRoom?.name||'Wohnzimmer');
  if(name===null)return;
  const trimmed=name.trim().slice(0,80);
  if(!trimmed){alert('Bitte einen Zimmernamen eingeben.');return}
  const existing=lib.rooms.find(r=>r.name.toLocaleLowerCase()===trimmed.toLocaleLowerCase());
  if(existing&&!confirm('Zimmer „'+existing.name+'“ überschreiben?'))return;
  if(!existing&&lib.rooms.length>=100){alert('Maximal 100 Zimmer möglich.');return}
  const id=existing?.id||('room_'+Date.now()+'_'+Math.random().toString(36).slice(2,8));
  const entry={id,name:trimmed,plan:JSON.parse(JSON.stringify(data))};
  if(existing)lib.rooms[lib.rooms.indexOf(existing)]=entry;else lib.rooms.push(entry);
  lib.active=id;

 };
 $('roomList').onclick=ev=>{
  const btn=ev.target.closest('button[data-action]');if(!btn)return;
  const index=Number(btn.dataset.index),entry=lib.rooms[index];if(!entry)return;
  if(btn.dataset.action==='open'){
   if(!confirm('Zimmer „'+entry.name+'“ öffnen? Der aktuelle Raum wird ersetzt. Nicht als Zimmer gespeicherte Änderungen bitte vorher sichern.'))return;
   const next=JSON.parse(JSON.stringify(entry.plan));
   data={room:next.room,items:next.items,next:Math.max(1,...next.items.map(i=>Number(i.id)+1))};
   selected=null;drag=null;lib.active=entry.id;
   if(!putLibrary(lib))return;
   save();close();fit();status('Zimmer „'+entry.name+'“ geöffnet');
  }else if(btn.dataset.action==='rename'){
   const name=prompt('Neuer Zimmername:',entry.name);if(name===null)return;
   const trimmed=name.trim().slice(0,80);
   if(!trimmed){alert('Bitte einen Namen eingeben.');return}
   if(lib.rooms.some(r=>r!==entry&&r.name.toLocaleLowerCase()===trimmed.toLocaleLowerCase())){alert('Dieser Name existiert bereits.');return}
   entry.name=trimmed;if(putLibrary(lib))roomLibrary();
  }else if(btn.dataset.action==='delete'){
   if(!confirm('Zimmer „'+entry.name+'“ endgültig aus der Zimmerliste löschen?'))return;
   lib.rooms.splice(index,1);if(lib.active===entry.id)lib.active=null;
   if(putLibrary(lib))roomLibrary();
  }
 };
}
