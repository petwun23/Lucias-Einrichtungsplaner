<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Lucias 3D-Raumviewer</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;color:#20314a;background:#eef3f9;-webkit-text-size-adjust:100%}body{display:flex;flex-direction:column;min-height:100dvh}header{background:#172d4b;color:white;padding:12px 15px;font-size:18px;font-weight:750}main{display:flex;flex-direction:column;min-height:0;flex:1}section{padding:12px;overflow:auto;max-height:43dvh;background:#fff;border-bottom:1px solid #cbd5e1}h2{font-size:16px;margin:0 0 10px}p{font-size:13px;line-height:1.45}button,.file-button{display:inline-block;border:1px solid #aab9cd;border-radius:9px;padding:10px 12px;background:#fff;color:#173d70;font-weight:700;font-size:14px;cursor:pointer}button.primary,.file-button{background:#2864bb;color:white;border-color:#2864bb}.row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:7px 0;border-bottom:1px solid #edf0f5}.row span{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row input{width:95px;flex:none;padding:8px;border:1px solid #9aaec7;border-radius:7px;font-size:16px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.muted{color:#52667f}.hidden{display:none!important}#viewer{flex:1;position:relative;min-height:220px;overflow:hidden;touch-action:none;background:linear-gradient(#e4eefb,#f9fbff)}canvas{display:block;width:100%;height:100%;touch-action:none}#hint{position:absolute;left:10px;bottom:10px;background:#ffffffd9;padding:6px 9px;border-radius:7px;font-size:12px;pointer-events:none}#status{font-size:12px;min-height:16px;margin-top:8px}#file{display:none}@media(orientation:landscape){main{flex-direction:row}section{width:min(370px,43vw);max-height:none;border-right:1px solid #cbd5e1;border-bottom:0}#viewer{min-height:0}} </style></head><body>
<header><button id="back2d" style="margin-right:12px;padding:6px 10px">← Zurück zu 2D</button>Lucias 3D-Raumviewer</header><main><section><h2>Höhen für diesen Raum</h2><p id="planInfo" class="muted">Raumdaten werden übernommen …</p><div id="heights" class="hidden"><h2>Höhen eingeben (cm)</h2><div class="row"><span>Raumhöhe</span><input id="roomHeight" type="number" min="180" max="600" step="1" value="250" inputmode="numeric"></div><div id="furnitureFields"></div><div class="actions"><button id="generate" class="primary">3D-Modell erstellen</button><button id="resetView">Ansicht zurücksetzen</button></div></div><div id="status" aria-live="polite"></div></section><div id="viewer"><canvas id="scene"></canvas><div id="hint">Finger ziehen: drehen · Zwei Finger: zoomen</div></div></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d');let plan=null,heights={},roomH=250,roomKey='draft',ready=false,az=-0.72,el=0.64,zoom=1,drag=null,pointers=new Map(),pinchDist=0;const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const finite=n=>Number.isFinite(Number(n));const num=n=>Number(n);const safeText=s=>String(s??'').slice(0,100);
function validate(p){if(!p||!p.room||!finite(p.room.w)||!finite(p.room.h)||num(p.room.w)<100||num(p.room.h)<100||num(p.room.w)>1500||num(p.room.h)>1500||!Array.isArray(p.items)||p.items.length>300)throw Error('Ungültiger oder zu großer Raumplan');for(const i of p.items){if(!['furniture','door','window'].includes(i.type)||!finite(i.w)||!finite(i.h)||num(i.w)<20||num(i.w)>1500||num(i.h)<20||num(i.h)>1500||!finite(i.x)||!finite(i.y))throw Error('Ungültiges Objekt im Raumplan')}}
function loadPlan(p,key){
 try{validate(p);roomKey=String(key||'draft').slice(0,150);plan={room:{w:num(p.room.w),h:num(p.room.h)},items:p.items.map(i=>({...i}))};ready=false;heights={};roomH=250;
 try{const saved=JSON.parse(localStorage.getItem('lucia_3d_heights_v1_'+roomKey)||'null');if(saved&&saved.heights&&typeof saved.heights==='object'){heights=saved.heights;roomH=Number(saved.roomH)||250}}catch(e){}
 $('roomHeight').value=roomH;
 const furniture=plan.items.filter(i=>i.type==='furniture'&&!i.parked);
 $('planInfo').textContent=`Raum: ${plan.room.w} × ${plan.room.h} cm · ${furniture.length} Möbel im Raum`;
 const list=$('furnitureFields');list.replaceChildren();furniture.forEach(i=>{const row=document.createElement('div');row.className='row';const span=document.createElement('span');span.textContent=(i.name||'Möbel')+' · '+i.w+' × '+i.h+' cm';const input=document.createElement('input');input.type='number';input.min='1';input.max='600';input.step='1';input.value=heights[String(i.id)]||80;input.inputMode='numeric';input.dataset.id=String(i.id);row.append(span,input);list.append(row)});
 $('heights').classList.remove('hidden');$('status').textContent='Höhen prüfen und 3D-Modell erstellen.';
 // Previously saved heights allow immediate 3D without another confirmation.
 if(Object.keys(heights).length && furniture.every(i=>heights[String(i.id)])){ready=true;$('status').textContent='Gespeicherte Höhen übernommen.'}
 draw();
 }catch(err){$('status').textContent='Fehler: '+err.message}
}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==window.parent||e.data?.kind!=='lucia-3d-plan')return;loadPlan(e.data.plan,e.data.roomKey)});
$('back2d').onclick=()=>window.parent.postMessage({kind:'lucia-3d-close'},location.origin);
window.parent.postMessage({kind:'lucia-3d-ready'},location.origin);
$('generate').onclick=()=>{if(!plan)return;const h=num($('roomHeight').value);if(!Number.isFinite(h)||h<180||h>600){$('status').textContent='Bitte Raumhöhe zwischen 180 und 600 cm eingeben.';return}const next={};for(const input of $('furnitureFields').querySelectorAll('input')){const v=num(input.value);if(!Number.isFinite(v)||v<1||v>600){$('status').textContent='Bitte gültige Möbelhöhen zwischen 1 und 600 cm eingeben.';input.focus();return}next[input.dataset.id]=v}heights=next;roomH=h;ready=true;az=-0.72;el=0.64;zoom=1;try{localStorage.setItem('lucia_3d_heights_v1_'+roomKey,JSON.stringify({roomH,heights}))}catch(e){}$('status').textContent='3D-Modell erstellt. Zum Drehen mit einem Finger ziehen.';draw()};
$('resetView').onclick=()=>{az=-0.72;el=0.64;zoom=1;draw()};
function project(x,y,z,w,h,unit){const cx=plan.room.w/2,cy=plan.room.h/2;const X=x-cx,Y=y-cy,Z=z-roomH*.26;const ca=Math.cos(az),sa=Math.sin(az),ce=Math.cos(el),se=Math.sin(el);const xx=X*ca-Y*sa,yy=X*sa+Y*ca;return {x:w/2+xx*unit,y:h*.53+(yy*se-Z*ce)*unit,depth:yy*ce+Z*se}}
function face(points,color,stroke='#64748b'){ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let k=1;k<points.length;k++)ctx.lineTo(points[k].x,points[k].y);ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.lineWidth=1;ctx.strokeStyle=stroke;ctx.stroke()}
function boxFaces(x,y,z,w,d,h,color,unit,W,H){const P=(a,b,c)=>project(a,b,c,W,H,unit);const v=[P(x,y,z),P(x+w,y,z),P(x+w,y+d,z),P(x,y+d,z),P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)];const defs=[[0,1,2,3],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7],[4,5,6,7]];const colors=[color[0],color[1],color[2],color[3],color[4],color[5]];return defs.map((indices,j)=>({pts:indices.map(k=>v[k]),color:colors[j],depth:indices.reduce((sum,k)=>sum+v[k].depth,0)/4}))}
function draw(){const bounds=canvas.getBoundingClientRect(),W=Math.max(1,bounds.width),H=Math.max(1,bounds.height),dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);if(!ready||!plan){ctx.fillStyle='#52667f';ctx.font='15px system-ui';ctx.textAlign='center';ctx.fillText('Raum wird vorbereitet …',W/2,H/2);return}const r=plan.room;const unit=Math.min(W/(r.w+r.h+roomH)*1.15,H/(r.w+r.h+roomH)*1.65)*zoom;let faces=[];faces.push(...boxFaces(0,0,-2,r.w,r.h,2,['#d7dfe9','#c9d4e2','#c9d4e2','#c9d4e2','#c9d4e2','#eef3f8'],unit,W,H));
// Rear walls: transparent surfaces with outlines; room stays open for inspection.
const wallEdges=[[[0,0,0],[r.w,0,0],[r.w,0,roomH],[0,0,roomH]],[[r.w,0,0],[r.w,r.h,0],[r.w,r.h,roomH],[r.w,0,roomH]],[[r.w,r.h,0],[0,r.h,0],[0,r.h,roomH],[r.w,r.h,roomH]],[[0,r.h,0],[0,0,0],[0,0,roomH],[0,r.h,roomH]]];
for(const edge of wallEdges){const pts=edge.map(v=>project(...v,W,H,unit));const depth=pts.reduce((s,p)=>s+p.depth,0)/4;faces.push({pts,color:'rgba(163,187,216,0.095)',depth,wall:true})}
const furniture=plan.items.filter(i=>i.type==='furniture'&&!i.parked);const palette=[['#9fc4e8','#729fc8','#5b89b5','#78a7d1','#6293bf','#b8d6f0'],['#dfbd9a','#c7a17d','#af8866','#d4ae88','#bd9672','#ead0b3'],['#b6d1b0','#8eae89','#749b70','#9abf94','#7da579','#cbe1c7'],['#c9b7dd','#a38cbe','#8d76aa','#b29bca','#9881b4','#dacbe8']];
furniture.forEach((i,k)=>{const h=heights[String(i.id)]||80;faces.push(...boxFaces(num(i.x),num(i.y),0,num(i.w),num(i.h),h,palette[k%palette.length],unit,W,H).map(f=>({...f,object:i}))) });
faces.sort((a,b)=>b.depth-a.depth);for(const f of faces){face(f.pts,f.color,f.wall?'#8ba0b9':'#7b8b9f')}
// Indicate door and window positions along room perimeter (not full cutouts in v1).
for(const i of plan.items.filter(i=>!i.parked&&(i.type==='door'||i.type==='window'))){const len=i.w,offset=num(i.offset)||0,wall=i.wall;const height=i.type==='door'?Math.min(roomH,205):120,base=i.type==='door'?0:90;let pts;if(wall==='top')pts=[[offset,0],[offset+len,0]];else if(wall==='bottom')pts=[[offset,r.h],[offset+len,r.h]];else if(wall==='left')pts=[[0,offset],[0,offset+len]];else if(wall==='right')pts=[[r.w,offset],[r.w,offset+len]];else continue;const quad=[...pts.map(p=>project(p[0],p[1],base,W,H,unit)),...pts.slice().reverse().map(p=>project(p[0],p[1],base+height,W,H,unit))];face(quad,i.type==='door'?'rgba(231,161,81,.28)':'rgba(62,181,223,.35)',i.type==='door'?'#b8752b':'#148db6')}
// Label objects above their top faces
ctx.font='600 12px system-ui';ctx.textAlign='center';furniture.forEach(i=>{const p=project(num(i.x)+num(i.w)/2,num(i.y)+num(i.h)/2,(heights[String(i.id)]||80)+8,W,H,unit);const label=safeText(i.name||'Möbel');const width=Math.min(160,ctx.measureText(label).width+12);ctx.fillStyle='rgba(255,255,255,.88)';ctx.fillRect(p.x-width/2,p.y-15,width,18);ctx.fillStyle='#233d60';ctx.fillText(label,p.x,p.y-2,width-8)})}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
canvas.addEventListener('pointerdown',e=>{if(!ready)return;canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)drag={x:e.clientX,y:e.clientY};else if(pointers.size===2){pinchDist=dist(...pointers.values());drag=null}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const d=dist(...pointers.values());if(pinchDist>0)zoom=clamp(zoom*d/pinchDist,.35,5);pinchDist=d;draw()}else if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;az+=dx*.012;el=clamp(el+dy*.009,.12,1.48);drag={x:e.clientX,y:e.clientY};draw()}});
function end(e){pointers.delete(e.pointerId);drag=null;pinchDist=0}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('wheel',e=>{if(!ready)return;e.preventDefault();zoom=clamp(zoom*(e.deltaY>0?.9:1.1),.35,5);draw()},{passive:false});new ResizeObserver(draw).observe($('viewer'));window.addEventListener('orientationchange',()=>setTimeout(draw,250));draw();
})();
</script></body></html>
